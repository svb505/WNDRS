 <html>
    <head>
        <style>
            body {
                font-family: 'Arial', sans-serif;
                background-color: #f0f8ff;
                margin: 0;
                padding: 20px;
            }
            .ticket-container {
                max-width: 600px;
                margin: 0 auto;
                background: linear-gradient(135deg, #ffffff, #e0eafc);
                padding: 30px;
                border-radius: 10px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.1);
                text-align: center;
            }
            .ticket-title {
                font-size: 28px;
                color: #2c3e50;
                margin-bottom: 20px;
            }
            .ticket-number {
                font-size: 36px;
                font-weight: bold;
                color: #e74c3c;
                background-color: #fff;
                display: inline-block;
                padding: 15px 30px;
                border: 2px dashed #e74c3c;
                border-radius: 8px;
                margin-top: 20px;
            }
            .ticket-info {
                font-size: 16px;
                color: #555;
                margin-top: 25px;
            }
            img {
                margin-top: 20px;
                max-width: 100%;
                border-radius: 10px;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            }
        </style>
    </head>
    <body>
        <div class="ticket-container">
            <div class="ticket-title">Поздравляем! Ваш Лотерейный Билет:</div>
            <div class="ticket-number">{ticket_number}</div>
            <div class="ticket-info">Храните его в безопасности. Возможно, это ваш счастливый билет!</div>
            <img src="{image}" alt="Лотерейный билет">
        </div>
    </body>
    </html>
